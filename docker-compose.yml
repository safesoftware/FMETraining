# docker-compose.yml — local end-to-end stack for the FME Training
# Automation multi-user web app. Owned by KNOW-2263 (Phase 0).
#
# Services:
#   app             FastAPI web (ENTRYPOINT_MODE=web), the user-facing API
#   worker-runner   Same image, ENTRYPOINT_MODE=worker. Profile-gated so it
#                   does NOT auto-start; invoke with
#                       docker compose run --rm worker-runner
#                   to mimic an ECS run-task locally.
#   postgres        Postgres 16, durable state for runs, locks, etc.
#   minio           Local S3 surrogate for artifacts/drafts/cache/images.
#   minio-init      One-shot mc bucket creator. Exits 0 once buckets exist.
#   mailhog         SMTP catcher for future email-notification testing.
#
# Network is scoped to a private bridge; only the ports we want exposed on
# the host (app, postgres, minio API + console, mailhog UI) are published.

name: fme-train

x-common-build: &common-build
  context: .
  dockerfile: Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-local}
    BUILD_DATE: ${BUILD_DATE:-unknown}

services:
  # --------------------------------------------------------------------- app
  app:
    build: *common-build
    image: fme-training-automation:local
    container_name: fme-train-app
    restart: unless-stopped
    env_file:
      - .env.compose
    environment:
      ENTRYPOINT_MODE: web
      PORT: "8000"
      # These override any stale values in .env.compose so that names always
      # match the compose service hostnames.
      DATABASE_URL: postgresql+psycopg://fme_train:fme_train@postgres:5432/fme_train
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-west-2
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload friendly: mount the app + pipeline source. Lesson content
      # and artifacts/data live outside the image and are not mounted —
      # Skilljar is the canonical source per plan section 1.
      - ./app:/app/app
      - ./pipeline:/app/pipeline
      - ./prompts:/app/prompts
      - ./worker.py:/app/worker.py:ro
      - ./pipeline.py:/app/pipeline.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [fme-train]

  # ----------------------------------------------------------- worker-runner
  worker-runner:
    build: *common-build
    image: fme-training-automation:local
    container_name: fme-train-worker
    profiles: ["worker"]   # NOT started by `docker compose up`
    env_file:
      - .env.compose
    environment:
      ENTRYPOINT_MODE: worker
      DATABASE_URL: postgresql+psycopg://fme_train:fme_train@postgres:5432/fme_train
      S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-west-2
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [fme-train]

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: fme-train-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fme_train
      POSTGRES_PASSWORD: fme_train
      POSTGRES_DB: fme_train
    ports:
      # Bind to loopback only — credentials are dev-default and the port
      # would otherwise be reachable from any other process on the host
      # (or from other containers / dev machines on shared networks).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fme_train -d fme_train"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [fme-train]

  # ------------------------------------------------------------------- minio
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: fme-train-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Bind to loopback only — see postgres above for rationale.
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [fme-train]

  # ------------------------------------------------------------- minio-init
  # One-shot container that creates the buckets the app expects, then exits.
  # docker compose treats `service_completed_successfully` as a satisfied
  # dependency, so app/worker-runner won't start until buckets exist.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: fme-train-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        set -eu;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        for b in fme-train-prod-artifacts fme-train-prod-drafts fme-train-prod-skilljar-content fme-train-prod-cache fme-train-prod-images; do
          mc mb --ignore-existing local/$$b;
        done;
        mc anonymous set download local/fme-train-prod-images || true;
        echo 'minio-init: buckets ready';
      "
    networks: [fme-train]

  # ----------------------------------------------------------------- mailhog
  # Optional SMTP catcher — kept out of the default startup path via a
  # profile so simple `docker compose up` doesn't pull an extra image. Run
  # with `docker compose --profile mail up` (or just `make up-mail`) when
  # email-notification testing is needed.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: fme-train-mailhog
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [fme-train]

volumes:
  pgdata:
  miniodata:

networks:
  fme-train:
    name: fme-train
    driver: bridge
