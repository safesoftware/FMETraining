# docker-compose.yml — local end-to-end stack for the FME Training
# Automation multi-user web app. Owned by KNOW-2263 (Phase 0).
#
# Services:
#   app             FastAPI web (ENTRYPOINT_MODE=web), the user-facing API
#   worker-runner   Same image, ENTRYPOINT_MODE=worker. Profile-gated so it
#                   does NOT auto-start; invoke with
#                       docker compose run --rm worker-runner
#                   to mimic an ECS run-task locally.
#   postgres        Postgres 16, durable state for runs, locks, etc.
#   mailhog         SMTP catcher for future email-notification testing.
#
# Network is scoped to a private bridge; only the ports we want exposed on
# the host (app, postgres, mailhog UI) are published.

name: fme-train

x-common-build: &common-build
  context: .
  dockerfile: Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-local}
    BUILD_DATE: ${BUILD_DATE:-unknown}

services:
  # --------------------------------------------------------------------- app
  app:
    build: *common-build
    image: fme-training-automation:local
    container_name: fme-train-app
    restart: unless-stopped
    env_file:
      - .env.compose
      # Optional real secrets for local SSO testing. When a .env exists at the
      # repo root (real GOOGLE_OAUTH_CLIENT_ID/SECRET, SESSION_SIGNING_KEY) it
      # overrides the .env.compose placeholders. required:false keeps `make up`
      # working without it. DATABASE_URL stays pinned by the
      # `environment:` block below regardless of what .env contains.
      - path: .env
        required: false
    environment:
      ENTRYPOINT_MODE: web
      PORT: "8000"
      # Pin DATABASE_URL to the compose postgres hostname. AWS_*/S3 are NOT
      # pinned — real creds (for image rehost on Save) flow from .env, and
      # nothing in the app uses minio (KNOW-2361 removed the dead surrogate).
      DATABASE_URL: postgresql+asyncpg://fme_train:fme_train@postgres:5432/fme_train
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload friendly: mount the app + pipeline source. Lesson content
      # and artifacts/data live outside the image and are not mounted —
      # Skilljar is the canonical source per plan section 1.
      - ./app:/app/app
      - ./pipeline:/app/pipeline
      - ./prompts:/app/prompts
      - ./worker.py:/app/worker.py:ro
      - ./pipeline.py:/app/pipeline.py:ro
      # tests/ is .dockerignore'd out of the runtime image (we don't ship it
      # to prod), so mount it here so `make test` (pytest, testpaths=tests)
      # has something to collect inside the container.
      - ./tests:/app/tests:ro
      # data/ is .dockerignore'd too (it's grouped with the local-only job
      # inputs), but it also holds product-mapping.json, which the manifest
      # pipeline + its tests load via config.PRODUCT_MAPPING_PATH. Mount it
      # read-only for dev/test. Prod data sourcing (bake in vs S3 vs
      # user-editable) is deferred to the pipeline-integration ticket.
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [fme-train]

  # ----------------------------------------------------------- worker-runner
  worker-runner:
    build: *common-build
    image: fme-training-automation:local
    container_name: fme-train-worker
    profiles: ["worker"]   # NOT started by `docker compose up`
    env_file:
      - .env.compose
    environment:
      ENTRYPOINT_MODE: worker
      DATABASE_URL: postgresql+asyncpg://fme_train:fme_train@postgres:5432/fme_train
    depends_on:
      postgres:
        condition: service_healthy
    networks: [fme-train]

  # ---------------------------------------------------------------- postgres
  postgres:
    image: postgres:16-alpine
    container_name: fme-train-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fme_train
      POSTGRES_PASSWORD: fme_train
      POSTGRES_DB: fme_train
    ports:
      # Bind to loopback only — credentials are dev-default and the port
      # would otherwise be reachable from any other process on the host
      # (or from other containers / dev machines on shared networks).
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fme_train -d fme_train"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [fme-train]

  # ----------------------------------------------------------------- mailhog
  # Optional SMTP catcher — kept out of the default startup path via a
  # profile so simple `docker compose up` doesn't pull an extra image. Run
  # with `docker compose --profile mail up` (or just `make up-mail`) when
  # email-notification testing is needed.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: fme-train-mailhog
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      # Bind to loopback only — mailhog is dev-tooling, not for sharing.
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8025/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [fme-train]

volumes:
  pgdata:

networks:
  fme-train:
    name: fme-train
    driver: bridge
